<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="searchstyle.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add a Vehicle</title>
  </head>
  <body>
    <div id="container">
      <header>
        <h1>Add a Vehicle</h1>
        <nav aria-label="Main navigation">
          <ul class="nav-links">
            <li><a href="index.html">People search</a></li>
            <li><a href="vehiclesearch.html">Vehicle search</a></li>
            <li><a href="addvehicle.html">Add a vehicle</a></li>
          </ul>
        </nav>
        <button id="resetbtn" onclick="resetdatabase()">Reset</button>
      </header>

      <aside>
        <img src="images/addvehicle.jpg" alt="Add vehicle" />
      </aside>

      <main>
        <label for="rego">Registration</label>
        <input type="text" id="rego" />

        <label for="make">Make</label>
        <input type="text" id="make" />

        <label for="model">Model</label>
        <input type="text" id="model" />

        <label for="colour">Colour</label>
        <input type="text" id="colour" />

        <label for="owner">Owner name</label>
        <input type="text" id="owner" />

        <button
          type="button"
          id="check-owner-btn"
          disabled
          onclick="checkOwner()"
        >
          Check owner
        </button>

        <div id="owner-results"></div>
        <button
          type="button"
          id="new-owner-btn"
          hidden
          onclick="newOwnerForm()"
        >
          New owner
        </button>

        <div id="new-owner-form" hidden>
          <label for="name">Name</label>
          <input type="text" id="name" />

          <label for="address">Address</label>
          <input type="text" id="address" />

          <label for="dob">Date of birth</label>
          <input type="date" id="dob" />

          <label for="license">Licence number</label>
          <input type="text" id="license" />

          <label for="expire">Licence expiry</label>
          <input type="date" id="expire" />

          <button type="button" id="add-owner-btn" onclick="addOwner()">
            Add owner
          </button>
          <p id="message-owner"></p>
        </div>

        <button type="button" id="add-vehicle-btn" onclick="addVehicle()">
          Add vehicle
        </button>
        <p id="message-vehicle"></p>
      </main>

      <footer>
        <p>Palantip Technologies Ltd - 1004 Coursework</p>
      </footer>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/supabaseclient.js"></script>
    <script src="js/reset.js"></script>
    <script src="js/addvehicle.js"></script>
  </body>
</html>
